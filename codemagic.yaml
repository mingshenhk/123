workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: dev
          include: true
          source: true
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Android native toolchain
        script: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Test and build Debug APK
        script: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee android-build.log
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/test-results/testDebugUnitTest/*.xml
      - app/build/reports/lint-results-debug.html
      - android-build.log
